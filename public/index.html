<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoneyBee Screening Test</title>
<style>
  :root { --bg:#0e0f12; --panel:#16181d; --line:#262a33; --text:#e9e6df; --muted:#9a9aa3; --gold:#d9b25f; --red:#e0654f; --amber:#e3a23b; --green:#5fb37c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font: 600 28px/1.2 Georgia, serif; margin: 0 0 6px; }
  h1 span { color: var(--gold); }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .banner { border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:12px 14px; font-size:14px; color:var(--muted); margin-bottom:24px; }
  .banner.warn { border-color: var(--amber); color: var(--amber); }
  form { display:flex; gap:10px; flex-wrap:wrap; margin-bottom: 8px; }
  input[type=text] { flex:1 1 300px; background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:14px; font-size:16px; }
  input[type=text]:focus { outline:none; border-color: var(--gold); }
  select { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:14px; font-size:16px; }
  button { background:var(--gold); color:#16130a; border:0; border-radius:10px; padding:14px 22px; font-weight:600; font-size:16px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .result-head { margin:28px 0 12px; font-size:18px; }
  .verdict { display:inline-block; padding:3px 10px; border-radius:99px; font-size:13px; font-weight:600; margin-left:8px; }
  .v-clear { background: rgba(95,179,124,.15); color: var(--green); }
  .v-review { background: rgba(227,162,59,.15); color: var(--amber); }
  .v-hit { background: rgba(224,101,79,.15); color: var(--red); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .card .top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
  .card .name { font-weight:600; font-size:17px; }
  .score { font: 700 22px Georgia, serif; }
  .meta { color:var(--muted); font-size:14px; margin-top:6px; display:flex; flex-wrap:wrap; gap:4px 16px; }
  .tag { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); }
  details { margin-top:20px; color:var(--muted); font-size:14px; }
  pre { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; overflow:auto; font-size:12px; color:var(--text); }
  .foot { margin-top:40px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>MoneyBee <span>Screening Test</span></h1>
  <p class="sub">Type a person or company name to check it against the sanctions list.</p>

  <div id="banner" class="banner">Loading list status...</div>

  <form id="f">
    <input type="text" id="name" placeholder="e.g. a person or company name" autocomplete="off" autofocus>
    <select id="type">
      <option value="any">Person or company</option>
      <option value="person">Person</option>
      <option value="company">Company</option>
    </select>
    <button id="go" type="submit">Screen</button>
  </form>

  <div id="out"></div>

  <p class="foot">For testing only. This is not a compliance decision. Real onboarding also needs the UAE Local Terrorist List, OFAC and PEP data (see LIVE_DATA.md in the risk data sources repo).</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

async function loadStatus() {
  try {
    const s = await (await fetch("/api/status")).json();
    const fake = s.source.includes("FICTIONAL");
    let msg = `Source: <b>${esc(s.source)}</b> &middot; ${s.records.toLocaleString()} records`;
    if (s.listGenerated) msg += ` &middot; list dated ${esc(s.listGenerated.slice(0, 10))}`;
    if (s.watchman) msg += ` &middot; Watchman: ${esc(s.watchman)}`;
    if (s.note) msg += `<br>${esc(s.note)}`;
    $("banner").innerHTML = msg;
    if (fake || s.note) $("banner").classList.add("warn");
  } catch { $("banner").textContent = "Cannot reach the server."; $("banner").classList.add("warn"); }
}

function verdict(top) {
  if (!top) return ["No match found", "v-clear"];
  if (top >= 90) return ["Strong match, review", "v-hit"];
  return ["Possible match, review", "v-review"];
}

function render(d) {
  const top = d.matches.length ? d.matches[0].score : 0;
  const [label, cls] = verdict(top);
  let html = `<div class="result-head">Results for <b>${esc(d.query)}</b><span class="verdict ${cls}">${label}</span></div>`;
  if (!d.matches.length) html += `<div class="card">No names scored 70 or above in ${esc(d.source)} (${d.ms} ms).</div>`;
  for (const m of d.matches) {
    html += `<div class="card"><div class="top"><div><div class="tag">${esc(m.type)} &middot; ${esc(m.list || "UN")}</div><div class="name">${esc(m.name)}</div></div><div class="score">${m.score}</div></div>
      <div class="meta">
        ${m.matchedName !== m.name ? `<span>Matched alias: ${esc(m.matchedName)}</span>` : ""}
        ${m.ref ? `<span>Ref: ${esc(m.ref)}</span>` : ""}
        ${m.listedOn ? `<span>Listed: ${esc(m.listedOn)}</span>` : ""}
        ${m.country ? `<span>Nationality: ${esc(m.country)}</span>` : ""}
        ${m.aliases.length ? `<span>Aliases: ${esc(m.aliases.slice(0, 4).join("; "))}${m.aliases.length > 4 ? "..." : ""}</span>` : ""}
      </div></div>`;
  }
  if (d.watchman) {
    html += `<details open><summary>Watchman response</summary><pre>${esc(JSON.stringify(d.watchman.ok ? d.watchman.data : d.watchman, null, 2).slice(0, 6000))}</pre></details>`;
  }
  $("out").innerHTML = html;
}

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = $("name").value.trim();
  if (name.length < 2) return;
  $("go").disabled = true;
  $("out").innerHTML = '<div class="result-head">Screening...</div>';
  try {
    const r = await fetch(`/api/search?name=${encodeURIComponent(name)}&type=${$("type").value}`);
    const d = await r.json();
    if (!r.ok) $("out").innerHTML = `<div class="card">${esc(d.error || "Error")}</div>`;
    else render(d);
  } catch { $("out").innerHTML = '<div class="card">Could not reach the server.</div>'; }
  $("go").disabled = false;
});

loadStatus();
</script>
</body>
</html>
